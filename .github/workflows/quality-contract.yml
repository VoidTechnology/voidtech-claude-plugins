name: Quality contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      - name: Validate repository contracts
        run: node scripts/run-quality.mjs --tier contract
