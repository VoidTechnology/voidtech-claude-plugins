# 渲染器浏览器验证（ADR-0005 §8）：绑定「渲染器变化」而非「PRD 内容变化」。
# 仅当渲染器代码、logic model schema、验证 harness、证明文件或本 workflow
# 变化时运行；证明继承成立时不重新打开浏览器（--check 已足够），但 CI 仍
# 完整跑一次浏览器断言，验证已提交证明宣称的结论真实成立。
name: Renderer validation

# 触发路径必须覆盖 renderer_env() 八个继承键的全部输入源，少一个就会出现
# 「渲染器已变、CI 不跑」的静默漏网：
#   assetDigest    ← assets/（viewer 模板）+ atlas.py + voidtech-core runtime/archify
#   archifyDigest  ← voidtech-core vendor/archify（升级 vendored Archify 必须重签证明）
#   fixtureDigest  ← atlas.py 内的 fixture
#   schemaVersion  ← logic-model.schema.json
# 两份 paths 必须保持一致；改一处漏一处正是本文件此前失效的原因。
on:
  pull_request:
    paths:
      - 'plugins/voidtech-product/skills/prd-from-requirements/**'
      - 'plugins/voidtech-core/runtime/archify/**'
      - 'plugins/voidtech-core/vendor/archify/**'
      - 'scripts/validate-renderer.mjs'
      - '.github/workflows/renderer-validation.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/voidtech-product/skills/prd-from-requirements/**'
      - 'plugins/voidtech-core/runtime/archify/**'
      - 'plugins/voidtech-core/vendor/archify/**'
      - 'scripts/validate-renderer.mjs'
      - '.github/workflows/renderer-validation.yml'

permissions:
  contents: read

concurrency:
  group: renderer-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0

      # 证明不继承 → fail：渲染器已变化但证明未重签，提示本地
      # `node scripts/validate-renderer.mjs --write` 后提交。
      - name: Check proof inheritance
        run: node scripts/validate-renderer.mjs --check

      # 完整浏览器验证：ubuntu-24.04 runner 自带 Google Chrome。
      - name: Run browser validation
        run: node scripts/validate-renderer.mjs
