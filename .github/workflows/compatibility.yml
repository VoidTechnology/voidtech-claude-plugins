name: Claude Code compatibility

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'plugins/**'
      - 'scripts/check-portability.sh'
      - '.github/workflows/compatibility.yml'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'plugins/**'
      - 'scripts/check-portability.sh'
      - '.github/workflows/compatibility.yml'
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Claude Code ${{ matrix.claude }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - claude: '2.1.154'
            scope: minimum
            plugin: voidtech-core
          - claude: '2.1.210'
            scope: minimum
            plugin: voidtech-loop
          - claude: '2.1.211'
            scope: all
          - claude: '2.1.220'
            scope: all
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep
          npm install --global @anthropic-ai/claude-code@${{ matrix.claude }}

      - name: Validate declared minimum version
        if: matrix.scope == 'minimum'
        run: scripts/check-plugin-compatibility.sh "${{ matrix.plugin }}"

      - name: Validate full Marketplace installation
        if: matrix.scope == 'all'
        run: scripts/check-portability.sh --install-smoke
