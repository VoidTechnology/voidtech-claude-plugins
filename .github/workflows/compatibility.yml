name: Claude Code compatibility

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - '.omp-plugin/**'
      - 'plugins/**'
      - 'scripts/check-portability.sh'
      - '.github/workflows/compatibility.yml'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - '.omp-plugin/**'
      - 'plugins/**'
      - 'scripts/check-portability.sh'
      - '.github/workflows/compatibility.yml'
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Claude Code ${{ matrix.claude }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - claude: '2.1.154'
            scope: minimum
            plugin: voidtech-core
          - claude: '2.1.210'
            scope: minimum
            plugin: voidtech-loop
          - claude: '2.1.211'
            scope: all
          - claude: '2.1.220'
            scope: all
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep
          npm install --global @anthropic-ai/claude-code@${{ matrix.claude }}

      - name: Install OMP 17.1.5
        if: matrix.scope == 'all'
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/can1357/oh-my-pi/releases/download/v17.1.5/omp-linux-x64 \
            --output /tmp/omp
          echo '35019bfa4d1acae0040ef1f3d91c29c6e7401acfcdbcfeba6ff506a6b103c987  /tmp/omp' \
            | sha256sum --check
          sudo install -m 0755 /tmp/omp /usr/local/bin/omp
          omp --version

      - name: Validate declared minimum version
        if: matrix.scope == 'minimum'
        run: scripts/check-plugin-compatibility.sh "${{ matrix.plugin }}"

      - name: Validate full Marketplace installation
        if: matrix.scope == 'all'
        run: scripts/check-portability.sh --install-smoke
