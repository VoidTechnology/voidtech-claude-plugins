name: Portability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep
          npm install --global @anthropic-ai/claude-code@2.1.220

      - name: Install OMP 17.1.5
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/can1357/oh-my-pi/releases/download/v17.1.5/omp-linux-x64 \
            --output /tmp/omp
          echo '35019bfa4d1acae0040ef1f3d91c29c6e7401acfcdbcfeba6ff506a6b103c987  /tmp/omp' \
            | sha256sum --check
          sudo install -m 0755 /tmp/omp /usr/local/bin/omp
          omp --version

      - name: Validate portability
        run: scripts/check-portability.sh --install-smoke
