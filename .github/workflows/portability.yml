name: Portability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep
          npm install --global @anthropic-ai/claude-code@2.1.220

      - name: Validate portability
        run: scripts/check-portability.sh --install-smoke
