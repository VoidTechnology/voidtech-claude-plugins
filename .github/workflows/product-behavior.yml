name: Product behavior

on:
  pull_request:
    paths:
      - 'plugins/voidtech-product/**'
      - 'plugins/voidtech-core/runtime/archify/**'
      - 'scripts/quality-manifest.mjs'
      - 'scripts/run-quality.mjs'
      - '.github/workflows/product-behavior.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/voidtech-product/**'
      - 'plugins/voidtech-core/runtime/archify/**'
      - 'scripts/quality-manifest.mjs'
      - 'scripts/run-quality.mjs'
      - '.github/workflows/product-behavior.yml'

permissions:
  contents: read

concurrency:
  group: product-behavior-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0

      - name: Run all Product behavior tests
        run: python3 -m unittest discover -s plugins/voidtech-product/skills/prd-from-requirements/tests -p 'test_*.py'
