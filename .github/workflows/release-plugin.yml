name: Release plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to release
        required: true
        type: choice
        options:
          - voidtech-core
          - voidtech-product
          - voidtech-design
          - voidtech-engineering
          - voidtech-loop
          - voidtech-mcp-common
          - voidtech-mcp-apple
      version:
        description: Exact version already present in plugin.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.plugin }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.validated-commit.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: main

      - name: Record validated commit
        id: validated-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.220

      - name: Validate release selection
        run: node scripts/check-plugin-version-bumps.mjs --release "${{ inputs.plugin }}" "${{ inputs.version }}"

      - name: Run full quality gate
        run: node scripts/run-quality.mjs --all

      - name: Validate isolated installation
        run: scripts/check-portability.sh --install-smoke

  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout validated main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}

      - name: Reject an existing tag
        env:
          TAG: ${{ inputs.plugin }}-v${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.plugin }}-v${{ inputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.commit }}
        run: gh release create "$TAG" --target "$TARGET_SHA" --title "$TAG" --generate-notes
